plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

android {
    namespace 'com.face.mymoney'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.face.mymoney"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"    : "true"
                ]
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField "String", "DEEPSEEK_API_KEY", "\"${localProperties.getProperty("deepseek.apiKey", System.getenv("DEEPSEEK_API_KEY") ?: "")}\""
            buildConfigField "String", "DEEPSEEK_MODEL", "\"${localProperties.getProperty("deepseek.model", "deepseek-v4-flash")}\""
        }
        release {
            buildConfigField "String", "DEEPSEEK_API_KEY", "\"\""
            buildConfigField "String", "DEEPSEEK_MODEL", "\"${localProperties.getProperty("deepseek.model", "deepseek-v4-flash")}\""
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
